name: Build APK

# Builds release APKs on every push and PR to main, on manual dispatch, and
# on version tags. Pushing a tag like v1.1.0 also attaches the APKs to a
# GitHub Release.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# Needed so the tag-triggered release step can create a Release and upload to it.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # Pinned to the toolchain the project is developed against.
          flutter-version: 3.44.9
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Set up release signing
        # Decodes the keystore and writes android/key.properties from repo
        # secrets so the release build is signed with the real key (upgradable
        # in place). With no secret present (e.g. a fork), it no-ops and the
        # Gradle config falls back to debug signing.
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No keystore secret configured; building debug-signed."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/maichat-release.jks
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=maichat-release.jks
          EOF

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build universal APK
        # One APK that installs on any device — no ABI-picking for the user.
        run: flutter build apk --release

      - name: Rename to MaiChat-<version>.apk
        # Give the single output a friendly, versioned name so the download is
        # obviously "the app", not app-release.apk.
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//' | cut -d'+' -f1)
          mv build/app/outputs/flutter-apk/app-release.apk \
             "build/app/outputs/flutter-apk/MaiChat-${VERSION}.apk"

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: MaiChat-apk
          path: build/app/outputs/flutter-apk/MaiChat-*.apk
          if-no-files-found: error

      - name: Build profile APK
        # A profile build keeps the Dart VM Service open so DevTools can attach
        # and record a real performance timeline on-device — at near-release
        # speed (unlike a debug build). Used to diagnose the floating-picture
        # pinch on the actual phone.
        run: flutter build apk --profile

      - name: Rename profile APK
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//' | cut -d'+' -f1)
          mv build/app/outputs/flutter-apk/app-profile.apk \
             "build/app/outputs/flutter-apk/MaiChat-${VERSION}-profile.apk"

      - name: Upload profile APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MaiChat-profile-apk
          path: build/app/outputs/flutter-apk/MaiChat-*-profile.apk
          if-no-files-found: error

      - name: Attach APK to release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/MaiChat-*.apk
          fail_on_unmatched_files: true
          generate_release_notes: true
